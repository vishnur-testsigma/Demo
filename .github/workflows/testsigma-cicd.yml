name: Testsigma CI/CD Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  run-testsigma-tests:
    name: Trigger & Monitor Testsigma Test Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make shell script executable
        run: chmod +x ./testsigma_cicd.sh

      - name: Run Testsigma Test Plan
        run: |
          ./testsigma_cicd.sh \
            --maxtimeinmins=60 \
            --reportfilepath=./junit-report.xml \
            --buildno=${{ github.run_number }}

      - name: Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsigma-junit-report
          path: |
            junit-report.xml
            testsigma.json
